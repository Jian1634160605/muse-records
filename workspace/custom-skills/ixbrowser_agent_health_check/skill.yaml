name: ixbrowser_agent_health_check
title: Check the ixBrowser agent before a round and escalate a long outage
description: Check the ixBrowser agent health before any round that needs it, skip the round when the agent is dead, and escalate a prolonged outage once instead of asking for a restart every round.
