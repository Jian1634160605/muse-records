  needs_review: false
  rationale: 'The ixBrowser agent was down from 2026-11-25 13:47 to 2026-11-26 07:33, over twelve hours with both ports unreachable and no self recovery, while three publish rounds produced 0 of 33 items and the user was asked repeatedly to restart the agent. The ixBrowser operations skill checks health only at install time and the FoxProfile recovery skill covers a different service, so no managed skill taught a pre round liveness gate or a single consolidated escalation for a prolonged outage. The new skill adds that gate, the skip and carry forward rule, and the twelve hour re escalation, while leaving any switch to the alternate agent service to the user or the engineer. Other candidates were checked and not proposed: the records daily sync approval timeouts and the Charlene B-18 approval cards are already covered by blocking_action_escalation reporting and await a user decision on standing authorization, the discussion versus execution corrections are behaviour with no reusable skill method, and consolidation is not triggered with 9 active learned skills against the 10 skill threshold.'
