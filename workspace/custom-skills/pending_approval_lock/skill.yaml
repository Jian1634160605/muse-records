  measurement:
    proxy_metric_id: pending_approval_breach_count
    success_criterion: Zero outbound sends on a locked thread, recipient, or item over the window, with every lock skip logged and reported to the user in the same round.
    window_days: 14
  needs_review: false
  rationale: A draft awaiting the user decision was sent by a scheduled watch round using its own version after the user had said to wait for approval, and the sent message could not be recalled. The alignment record states that a new reply trigger does not cover an item already marked as waiting for approval. The worker-facing FB operations skill contains the competing instruction to reply to a new reply at once and no lock check before a scheduled send, while the existing blocking escalation skill covers reporting a block and the general messaging skill covers approval in chat, neither covers a lock that a scheduled or background worker must check before sending. This new skill adds that check, the set and clear rules, and the same-round report for a skipped send.
