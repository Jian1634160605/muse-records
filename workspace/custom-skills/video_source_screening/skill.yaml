  rationale: 'On 2026-10-21 the user flagged torn and incomplete frames in published IG videos (message:5d8793e0). Frame-by-frame review confirmed the v1/v3 banner text was cropped at the frame edge, v1 mixed two different patients under one caption, and v2 carried a third-party watermark over the title (assistant-msg-2eb80b51); the defective posts were deleted at the user''s request (assistant-msg-3d947398). The admitted root cause was selecting sources on view count alone with no frame-consistency screening. The same day an attribution rule was confirmed: @reface_scarless is a non-company team whose footage may be studied for structure only and never redistributed (assistant-msg-04905de2), and @yefacialdesign is likewise not a company account (message:004a3184). Neither the QC gate nor the attribution rule appears in any managed document or in the FB workflow docs (~/workspace/fb-ip/viral-playbook.md, ~/workspace/fb-ip/sprint-100w-12day.md); the existing assembly skill (viral-template-replicator, unmanaged) only accepts the built timeline and never screens source selection. A selection-time gate would have rejected the torn clips before editing, and the attribution rule directly protects the ongoing 9-video FB sprint, which references non-company accounts as models.'
