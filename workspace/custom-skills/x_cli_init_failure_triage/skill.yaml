    success_criterion: Zero cases of five or more consecutive identical failures with no diagnosis record over the window, whether the failure is a client init failure or a platform rejection, and every persistent failure either resolves through a diagnosed fix or stays reported as an open block with its queue held.
    window_days: 14
  rationale: 'On 2026-11-17 X post p2756 reached a tenth failure at 20:33 because its chuhai.wiki link was judged potentially harmful, after failures at 08:23, 08:33, 11:33, 13:03, 14:33, 16:03, 17:33 and 19:03, while the latest post stayed at p2755 from 08:13 and no decision was recorded. The existing managed skill x_cli_init_failure_triage stops blind retries only for client init failures, so a platform rejection of the post content fell outside its scope and the same unchanged draft kept being probed about every 90 minutes. Widening the stop rule, the diagnosis steps and the description to cover platform rejections puts the p2756 pattern inside the skill a worker loads before retrying. Checked and not proposed: same-author over-frequency comments are already covered by outward_action_verification inside its window to 2026-11-30, and the multi-account browser concurrency fix is still an untested draft plan with resume pending a user discussion, so no skill is proposed for it.'
