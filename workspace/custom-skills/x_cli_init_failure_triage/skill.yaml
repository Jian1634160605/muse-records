  rationale: 'X promo posting moved from intermittent ClientTransaction init failures to a persistent block: the handoff records p20 failing from 2026-10-26 16:55Z onward, 30 consecutive failures by the 21:47Z daily report, and failures still running at 2026-10-27 03:03Z, with the latest post staying at p19 (2114639360117354726) and tweet count 313. Chunk 3 adds repeated x-promo-retry-p1 cron failures with the generic worker unfinished report (d996db85, 2475a302, bc520159, 4c886cb8). Retries kept running every ten minutes with no diagnosis recorded and the queue growing to p20-p37, while timeline checks proved no retry reached the platform. A skill search found no X connector doc and no init triage skill, and social_publishing covers verifying a post but not stopping a blind retry run or diagnosing init inputs. This skill sets a three failure stop, one input at a time diagnosis, timeline proof of success, and an open block report, which would have changed the observed behaviour. FoxProfile entry trouble and other failures were checked and not proposed: the 18:45 FoxProfile entry failure is already covered by the active foxprofile_session_recovery service check, and the four managed skills remain inside their measurement windows, so no update to them is proposed.'
