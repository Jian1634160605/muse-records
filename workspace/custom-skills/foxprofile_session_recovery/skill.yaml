name: foxprofile_session_recovery
title: Recover FoxProfile sessions before judging them broken
description: Recover slow or failed FoxProfile browser sessions with a service check, a stored-tab wait, and a restart retry before reporting an account or proxy line as broken.
category: Work and knowledge
