  measurement:
    proxy_metric_id: foxprofile_false_broken_report
    success_criterion: Zero accounts or proxy lines reported as broken on a first timeout alone over the window, and every slow-restore failure that is retried after the 45 second wait and a service restart either succeeds or is reported with the exact failed step.
    window_days: 14
  needs_review: false
  rationale: 'On 2026-10-25 a multi-account check found 0 of 6 logins confirmed with proxy-start failures and page load timeouts, while direct proxy tests to facebook.com all passed, pointing to the FoxProfile launch step rather than proxy or session loss. After a service restart 5 of 6 accounts confirmed, and the remaining account succeeded only after waiting 45 seconds for stored old tabs to restore, where earlier attempts navigated after about 12 seconds and hit a 15 second navigation timeout. The same cause recurred in the 15:45 warm round, which completed only 3 of 6 accounts, with the same account failing on navigation timeouts and a shared proxy line failing starts in-round while its direct test returned success. No existing skill covers this sequence: a skill search for FoxProfile warmup returned only the unrelated blocking escalation skill, and the workspace notes record only the start script and endpoint check, not the 45 second wait, the direct proxy discrimination test, or the restart-then-retry order. The proposed skill codifies exactly that sequence so a slow restore is no longer misread as a broken account.'
