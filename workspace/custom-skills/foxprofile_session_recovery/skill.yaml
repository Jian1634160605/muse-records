name: foxprofile_session_recovery
title: Recover FoxProfile sessions before judging them broken
description: Recover slow or failed FoxProfile browser sessions with a service check, a stored-tab wait, and a restart retry before reporting an account or proxy line as broken, and check status without exposing credentials.
category: Work and knowledge
include_in_prompt: false
skill_improvement:
  managed: true
  status: active
  evidence_handles:
  - message:assistant-msg-d8eed44b-c5d3-9dd7-3ca1-0dc840db442d
  - message:assistant-msg-a0906648-571a-4479-a918-da6e61b113ba
  - ~/AGENTS.md
  measurement:
    proxy_metric_id: foxprofile_credential_leak
    success_criterion: Zero proxy credential values printed into tool output, files, reports, or memory over the window, and every FoxProfile status check extracts only the environment name and whether it is running.
    window_days: 14
  needs_review: false
  rationale: 'The FoxProfile profiles endpoint returns proxy credentials inline, a behaviour recorded in ~/AGENTS.md on 2026-10-25, yet on 2026-11-10 it leaked credentials into tool output twice in one day for two different lines, forcing the user to order replacement lines. The managed foxprofile_session_recovery skill, the only FoxProfile skill returned by skill search, teaches the service check but says nothing about the credential risk of the profiles response, so workers loading it had no guard at the point of the check. Adding a credential safe status section to that skill puts the name plus is_running only rule where FoxProfile checks are actually performed. Other candidates were checked and not proposed: state file truncation and concurrent overwrite are already covered by state_file_write_safety, shared browser contention is already covered by the resident browser rule in fb-ip-operations, and the X self-cite verification, IG content-only stop, short comment approval scope, and X queue full text cases were single incidents or already working.'
  review_after: 2026-11-25T00:55:41.852107+00:00
  reviewed_at: 2026-11-11T00:55:41.852107+00:00
  run_id: sirun_269d6cf74c704d4aba4d1a5cf7668dbf
