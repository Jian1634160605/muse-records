  rationale: 'The escalation rule existed only in one task body and not in the hunter task, was then clarified to immediate notification after a short wait rather than on timeout, and still failed the same evening when a Lucy follow-up approval card appeared at 21:05 Beijing and was approved at 22:34 with no urgent-channel call, with the executor later reading the rule as timeout-only. The user then set it as a top rule: report any platform or account problem at once in the main chat and the urgent channel with platform, account, problem, and whether the user must act, never deferred to a daily report. This mirrors the earlier quota lesson where a fix in one surface did not generalize. A skill_search for approval escalation returned only unrelated skills, so no existing skill covers this reusable trigger, dual-channel, four-fact, and cross-task propagation method.'
