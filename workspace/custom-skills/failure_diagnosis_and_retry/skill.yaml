  rationale: 'Ten active learned skills trigger consolidation. I read both source skills in full. untruncated_error_diagnosis teaches getting full output, checking helper artifacts, and recomputing platform counted limits, and its own rationale says x_cli_init_failure_triage records exact error text but does not teach how to obtain it when output is truncated. x_cli_init_failure_triage teaches the three failure stop rule, one element diagnosis, and timeline verification for X init failures and platform rejections. They are the same stop and diagnose workflow split across two loads. The 2026-11-27 Antigravity case in the packet reinforces the merge: a VPN cause was named before the exit address and the account bound region were checked separately, and the alignment synthesis records that VPN hypothesis as falsified. The merged skill preserves every rule from both sources and adds that separate cause check. Other overlaps were checked and not merged: blocking_action_escalation and outward_action_verification cover different stages, approval lock plus escalation versus pre-action record checks, and fb_reel_publish_verification is an amendment to social_publishing while video_source_screening is a pre-publish gate, so merging either pair would blur distinct stages.'
