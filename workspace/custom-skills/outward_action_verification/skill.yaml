  rationale: Ten active learned skills trigger consolidation. dedup_state_verification and self_cite_attribution_verification teach the same pre-action record-check method, and the 2026-11-15 window shows the same family failing again as same-author over-frequency comments (14 counted, Nora commented a fifth time after the ledger said do not comment again) and as a friend-list loss falsely reported from a first page alone. Merging the two skills into outward_action_verification, with the frequency and pagination-completeness checks added, puts every pre-action record check in one place a worker loads before commenting or posting. The deterministic candidates for goals_bookkeeping, memory, and ideas recurring failures were rejected as skill changes because they call for objective-loop prompt or cadence changes, which this loop does not publish. The FB 2FA all-zero days are a user-approval dependency already covered by blocking_action_escalation reporting, with no reusable skill method to add.
