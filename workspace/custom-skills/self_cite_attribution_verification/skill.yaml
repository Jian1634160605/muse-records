    success_criterion: Zero comments or posts that cite another account's post as your own over the window, and every self-cite passes an ownership check and a banned list check before posting.
    window_days: 14
  rationale: The dedup skill checks whether a target was already acted on and is inside its measurement window to 2026-11-17, so it is not updated here. It does not check whether a quoted link is actually your own post. Post 2118857965977653461 was identified as another account's post and banned in message 38344b99, yet it was cited as a self-cite again at least six times on 2026-11-09. Other wrong cites in the same window belonged to Stanllll6o, AndyHu44502446, make_claude, MiaAI_lab and Aly12138. The daily report in message 9b8529cd counted 67 self-cites including misattributed ones. A skill search for self-cite attribution returned no skill that verifies cited ownership or enforces a banned cite list at generation time. This new skill adds that pre-action ownership and banned list check, distinct from the dedup read check.
